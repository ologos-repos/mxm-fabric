    text: No trusted key and no signature can verify arbitrary messages; small-order and non-subgroup keys are refused.
    source: "Principal Advisor REVISE, 2026-09-28, finding 2"
  - id: REQ-MXK-DOC-01
    text: The ADR and SPEC state no guarantee stronger than the code enforces, and name what still raises and what replay does not re-check.
    source: "Principal Advisor REVISE, 2026-09-28, claims findings"
